<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos em HTML5</title>
</head>

<body>

    <h1>Inserindo vídeos hospedados localmente</h1>
        <p>Este vídeo está hospedado no meu próprio navegador</p>
            <video width="500" poster="imagem/limoes-capa.png" controls>
                <source src="videos/meu-video.mp4.mp4" type="video/mp4">
                <source src="videos/meu-video.m4v.m4v" type="video/mp4">
                <source src="videos/meu-video.webm.webm" type="video/webm">
                <source src="videos/meu-video.ogv.ogv" type="video/ogv">
            </video>
        <p>Seu navegador não tem compatibilidade com reprodução de vídeos.</p>
    <!--Problema disso é que gera um auto custo, a solução é utilizar videos de alguma hospedagemm por exemplo do youtube.-->
    <h1>Inserindo vídeos do youtube</h1>
                <div style="position: relative; padding: 56%;"><iframe width="560" height="315" src="https://www.youtube.com/embed/HhpuKezTm4c?si=1j7pTcdjOftm1Zhh" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen style="position: absolute; top: 5%; left: 5%; width: 90%; height: 90%;"></iframe></div>

</body>

</html>
