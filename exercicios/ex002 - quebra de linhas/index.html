<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 2</title>

</head>

<body>
    <p>
        Você pode escrever qualquer coisa
        basta colocar tudo
        no meio do par de tag's 
        p e /p
    </p>
    <p>
        Se precisar quebrar o texto
        em algum lugar específico <br>
        Como esse, você pode usar a tag &lt;br&gt;. 
    </p>
    <!--o lt e o gt são nada mais nada menos que
    lt "LESS THAN" (menor que) e gt "GREATER THAN" (maior que)-->
    <!--A sigla br é uma quebra de linha.-->
    &reg;
    &copy;
    &trade;
    <!--Além de conseguirmos colocar os simbolos de moeda
    também conseguimos colocar qualquer emoji da emojipedia-->
    &#x1F913 <!--Com esse comando &#x e o código do emoji-->
</body>

</html>
