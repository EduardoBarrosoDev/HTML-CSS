<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes externas</title>
    <style>
        @font-face {
            font-family: 'Love';
            src: url(Skinship\ Demo.otf) format('opentype');
        }
        @font-face {
            font-family: 'Love2';
            src: url(Cheerful\ Holiday.otf) format('opentype');
        }
        main {
            background-color: white;
            border-radius: 10px;
            box-shadow: 5px 5px 5px;
            width: 600px;
            margin: auto;
            text-align: center;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(250, 21, 21);
        }

        h1 {
            font-family: 'Love','Times New Roman', Times, serif;
            font-size: 3em;
        }
        p {
            font-family: 'Love2', 'Times New Roman', Times, serif;
        }
    </style>
</head>
<body>
    <main>
    <h1>Eu te amo Maria Luiza</h1>
    <p>Você é o amor da minha vida!</p>
    <p>Eu te escolheria quantas vezes fossem necessárias</p>
    <p>Te esperei por toda minha vida!!</p>
    </main>

</body>
</html>
