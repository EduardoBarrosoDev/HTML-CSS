<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        caption {
            font-size: 1.3em;
            font-weight: bolder;
            padding: 8px;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
        }

        col.cnome {
            background-color: chartreuse;
        }
    </style>
</head>
<body>
    <h1>Exercicio de tabela</h1>
    <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo">
            <col class="cidade">
            <col class="cprof">
        </colgroup>
        <Caption>Cadastro</Caption>
        <tr>
            <th scope="col">nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>25</td>
            <td>Jornalista</td>
        </tr>       
        <tr>
            <td>Eduardo Barroso</td>
            <td>M</td>
            <td>21</td>
            <td>Programador</td>
        </tr>
        <tr>
            <td>Maria Luiza</td>
            <td>F</td>
            <td>21</td>
            <td>Médica de cachorro</td>
        </tr>
        <tr>
            <td>Thays Barroso</td>
            <td>F</td>
            <td>40</td>
            <td>Expert em tudo</td>
        </tr>
        <tr>
            <td>Felix Doria</td>
            <td>M</td>
            <td>42</td>
            <td>Empresário</td>
        </tr>
        <tr>
            <td>Tauany Barroso</td>
            <td>F</td>
            <td>24</td>
            <td>Uber</td>
        </tr>
    </table>
</body>
</html>
